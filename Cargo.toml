[package]
name = "pieced"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Solo first-person shooter with Fortnite-style building for a MacBook trackpad"
license = "MIT"
publish = false

[dependencies]
bevy = { version = "=0.19.1", features = ["wav"] }
avian3d = "=0.7.0"
bevy_egui = "=0.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSWindow"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
codegen-units = 16
debug = false
