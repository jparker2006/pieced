[package]
name = "pieced"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Solo first-person shooter with Fortnite-style building for a MacBook trackpad"
license = "MIT"
publish = false

[dependencies]
# `vorbis` (the pure-Rust lewton decoder, OK'd by Jake 2026-09-28): the music is
# Ogg Vorbis (M4 chunk 3, `assets/music/`).
bevy = { version = "=0.19.1", features = ["wav", "vorbis"] }
avian3d = "=0.7.0"
bevy_egui = "=0.42.0"
bevy_mod_outline = "=0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# The wgpu Bevy 0.19.1 renders with (same version, no extra features): GPU
# timestamp queries for the session log (`src/gpu_timing.rs`).
wgpu = { version = "=29.0.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSWindow"] }

[profile.dev]
opt-level = 1
# No debug info: on macOS, split debug info leaves every rebuild's object files in
# the shared target dir (18.7 GB of them by 2026-09-26). Panics still name file:line.
debug = false

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
codegen-units = 16
debug = false
# No symbol table in the play binary: 75 MB of its 190 MB, and a new binary's
# first (cold) launch is scanned in full before it runs. Panics still name
# file:line; backtraces lose function names.
strip = "symbols"
